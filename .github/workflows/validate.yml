name: Validate profile
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow==11.1.0
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_profile.py
      - name: Check public GitHub repository references
        env:
          GH_PUBLIC_LINKS_TOKEN: ${{ github.token }}
        run: python scripts/validate_repo_references.py
