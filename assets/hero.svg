<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
<title id="title">Sir Davi | I code sometimes</title>
<desc id="desc">Sir Davi profile banner with a finite circuit-node pulse and orbital detail.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#09101d"/><stop offset=".55" stop-color="#10192b"/><stop offset="1" stop-color="#1d1640"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60f2db"/><stop offset="1" stop-color="#ac87ff"/></linearGradient>
<pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#64748b" stroke-opacity=".15" stroke-width="1"/></pattern>
<clipPath id="panel"><rect width="1200" height="310" rx="24"/></clipPath>
</defs>
<g clip-path="url(#panel)">
<rect width="1200" height="310" fill="url(#bg)"/><rect width="1200" height="310" fill="url(#grid)"/>
<path d="M0 282H1200M0 32H1200" stroke="#60f2db" stroke-opacity=".15"/>
<path d="M610 -40L1040 350M740 -40L1160 350" stroke="#b7a0ff" stroke-opacity=".10" stroke-width="14"/>
<g stroke="url(#accent)" fill="none" stroke-width="2" opacity=".76"><path d="M820 247H905L946 206H1123"/><path d="M870 72H1000L1042 114H1200"/><path d="M1080 0V45L1030 95H915"/><circle cx="920" cy="95" r="7" fill="#60f2db"><animate attributeName="opacity" values=".4;1;.4" dur="3.8s" repeatCount="3"/></circle><circle cx="1123" cy="206" r="7" fill="#ac87ff"/><circle cx="905" cy="247" r="4" fill="#60f2db"/></g>
<g transform="translate(970 151)" opacity=".58" fill="none"><circle r="84" stroke="#a78bfa" stroke-width="1.6"/><circle r="57" stroke="#60f2db" stroke-width="1.7"/><path d="M-107 0H107M0-107V107" stroke="#a78bfa" stroke-width="1.3"/><path d="M-45 -45L45 45M45 -45L-45 45" stroke="#60f2db" stroke-width="1.2"/><circle r="12" fill="#60f2db" fill-opacity=".30" stroke="#60f2db"/><g><circle cx="84" cy="0" r="4" fill="#ac87ff"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="1" fill="freeze"/></g></g>
<path d="M64 66H163" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
<text x="64" y="135" fill="#f8fafc" font-family="Consolas, 'Segoe UI', sans-serif" font-size="76" font-weight="700" letter-spacing="-2">SIR DAVI</text>
<text x="69" y="180" fill="#8eeada" font-family="Consolas, monospace" font-size="24" letter-spacing="3">I CODE SOMETIMES...</text>
<text x="69" y="239" fill="#cbd5e1" font-family="Consolas, monospace" font-size="17" letter-spacing="2">FUNCTION  /  DESIGN  /  SYSTEMS  /  MEDIA</text>
