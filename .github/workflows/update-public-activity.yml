name: Refresh public activity
on:
  schedule:
    - cron: "17 9 * * 1,5"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Regenerate public-only activity
        run: python scripts/render_public_activity.py --username ihatesirdavi --days 28 --output assets/public-activity.svg
      - name: Validate profile
        run: python scripts/validate_profile.py
      - name: Commit refreshed chart if changed
        run: |
          if ! git diff --quiet -- assets/public-activity.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- assets/public-activity.svg
            git commit -m "chore(profile): refresh public-only activity"
            git push origin HEAD:main
          fi
